{% load i18n %}
{% load static %}
{% load escapejson %}

<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title">
            {% if label == 'avg' %}
                {% trans "Average price" %}
            {% elif label == 'total' %}
                {% trans "Total revenue" %}
            {% endif %}
        </h3>
    </div>
    <div class="panel-body">
        <noscript>
            <div class="alert alert-warning">
                {% trans "JavaScript is required to show the chart at this time, sorry!" %}
            </div>
        </noscript>
        <div class="chart"
             data-stretchgoal-chart="{{ label }}"
             data-chart-label="{% if label == 'avg' %}{% trans "Average price" %}{% elif label == 'total' %}{% trans "Total revenue" %}{% else %}{% endif %}"
        >
            <script type="application/json">{{ data|escapejson }}</script>
        </div>
    </div>
</div>
